version: '3.8' 

services:

  backend:
    image: vinit1809/rule_engine_backend 
    container_name: rule_engine_backend
    ports:
      - "5000:5000" 
    networks:
      - rule_engine_network


  frontend:
    image: vinit1809/rule_engine_frontend  
    container_name: rule_engine_frontend
    ports:
      - "3000:3000" 
    depends_on:
      - backend
    networks:
      - rule_engine_network

networks:
  rule_engine_network:

